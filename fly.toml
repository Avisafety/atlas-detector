# Fly.io service definition for atlas-detector.
#
# Runs in the same organisation as the `live-video` MediaMTX app, so it reaches
# the media server over the private 6PN network at live-video.internal:8554
# (RTSP is not exposed publicly).
#
# Deploy manually from this directory:
#   fly deploy
#
# Required secrets:
#   fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... \
#     DETECTOR_SHARED_SECRET=...
#
# No serial number or flight session is configured: the detector discovers
# every active flight with a live Atlas stream by itself.

app = "atlas-detector"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  # No public IP: the only way in is the private Flycast address
  # (atlas-detector.flycast), plain HTTP inside the Fly organisation.
  force_https = false
  # Scale to zero. The proxy must never stop the machine itself — the
  # detector receives no inbound traffic while it analyses (it pulls RTSP), so
  # the proxy would think it idle mid-flight. Instead the app exits after
  # IDLE_EXIT_MINUTES without video (restart policy on-failure → stopped), and
  # a request to http://atlas-detector.flycast/wake (sent by MediaMTX when a
  # drone publishes or a viewer starts watching) makes the proxy start it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[env]
  # Stream discovery — no per-drone configuration needed.
  RTSP_BASE_URL = "rtsp://live-video.internal:8554"
  MAX_STREAMS = "2"
  DISCOVERY_INTERVAL_SECONDS = "10"
  SENSOR_STALE_SECONDS = "300"

  # YOLO26n detection.
  DETECTION_FPS = "20"
  # COCO classes relevant from a drone; the UI filters which ones are drawn.
  DETECTION_CLASSES = "person,bicycle,car,motorcycle,airplane,bus,train,truck,boat,bird,dog,horse,sheep,cow,kite,surfboard"
  # Deliberately low: the video dialog filters client-side with a sensitivity
  # slider, so the operator can raise sensitivity without a redeploy.
  DETECTION_CONFIDENCE = "0.20"
  # Longest side used for the fast pass — balances speed and range.
  INFER_MAX_SIDE = "640"
  # BoT-SORT with background-only camera-motion compensation ("bytetrack" =
  # previous tracker, instant rollback).
  TRACKER_IMPL = "botsort"
  # Analysed frames a lost track survives inside ByteTrack (now exact; at
  # ~20 fps this is 0.25 s, the same wall time as before the speed-up).
  TRACKER_LOST_BUFFER = "5"
  # Boxes disappear fast when an object leaves the frame.
  TRACK_TTL_SECONDS = "0.2"

  # Long-range pass: tiled full-resolution analysis at a low cadence, merged
  # into the same tracker. Catches small/distant objects the downscale loses.
  RANGE_PASS_ENABLED = "true"
  RANGE_PASS_INTERVAL_SECONDS = "4.0"
  RANGE_TILE_COLS = "2"
  RANGE_TILE_ROWS = "2"
  RANGE_TILE_OVERLAP = "0.15"
  RANGE_CONFIDENCE = "0.15"
  RANGE_DEDUPE_IOU = "0.5"
  # A tile only sees part of a large object, so its box lands INSIDE the
  # full-frame box — low IoU, high containment. This is what removes the
  # stacked duplicate boxes around one person.
  RANGE_CONTAINMENT = "0.7"
  # Range boxes older than this are not re-fed (0 = interval + 0.5s).
  RANGE_RESULT_MAX_AGE_SECONDS = "0"
  # Temporary: set to "true" to log per-source counts and each suppression.
  RANGE_DEBUG = "false"

  # How boxes reach the browser: "both" during the transition (Broadcast +
  # atlas_detections), then "broadcast" (only locked tracks in the table).
  # "postgres" is the old behaviour and the instant rollback.
  DETECTIONS_TRANSPORT = "broadcast"
  # Broadcast snapshots per second per stream (frontend glides boxes with
  # vx/vy in between). Keeps Realtime's messages/s quota comfortable.
  BROADCAST_MAX_HZ = "10"

  # Sleep after 10 minutes without video; woken through /wake (see above).
  IDLE_EXIT_MINUTES = "10"

  # Logging: one summary line per stream every 10 s. OpenCV's own warnings
  # (e.g. "can't be used to capture by name" after every failed RTSP open)
  # are noise next to the detector's "stream error" line.
  LOG_SUMMARY_SECONDS = "10"
  OPENCV_LOG_LEVEL = "ERROR"

[[vm]]
  # Dedicated CPU — on shared CPU the machine, not the code, caps the frame rate.
  size = "performance-2x"
  memory = "4096mb"
