# Fly.io service definition for atlas-detector.
#
# Runs in the same organisation as the `live-video` MediaMTX app, so it reaches
# the media server over the private 6PN network at live-video.internal:8554
# (RTSP is not exposed publicly).
#
# Deploy manually from this directory:
#   fly deploy
#
# Required secrets:
#   fly secrets set MEDIAMTX_RTSP_URL=... SUPABASE_URL=... \
#     SUPABASE_SERVICE_ROLE_KEY=... FLIGHT_SESSION_ID=...

app = "atlas-detector"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[env]
  # "yolo" (fast COCO classes, 10fps) or "grounding_dino" (text-prompted, tuned config below).
  DETECTION_ENGINE = "grounding_dino"
  DETECTION_FPS = "10"
  DETECTION_CLASSES = "person,car,truck,bus,motorcycle,boat"
  # Slightly lower than before: faster hits, at the cost of more false ones.
  DETECTION_CONFIDENCE = "0.30"
  # Longest side used for inference. Lower = faster and more responsive boxes.
  INFER_MAX_SIDE = "480"
  # Analysed frames a lost track survives inside ByteTrack.
  TRACKER_LOST_BUFFER = "5"
  # Grounding DINO only — it is much slower on CPU, hence one frame per 5s.
  DETECTION_FPS_GROUNDING_DINO = "0.8"
  DETECTION_TEXT_PROMPT = "person . chair . fingers . street light . car . boat . truck . bus . motorcycle"
  DETECTION_BOX_THRESHOLD = "0.15"
  DETECTION_TEXT_THRESHOLD = "0.20"
  # Tiled full-resolution pass (Grounding DINO only): finds small/distant
  # objects the downscaled fast pass loses. Tiles run in parallel on the
  # dedicated cores below.
  DETECTION_FPS_TILED = "2.0"
  TILE_GRID = "3x5"
  TILE_OVERLAP = "0.15"
  ROI_PADDING = "0.2"
  ROI_CONFIRM_FRAMES = "2"
  ROI_MISS_LIMIT = "10"
  ROI_MAX = "15"
  ROI_IOU_MATCH = "0.6"

  # Boxes disappear fast when an object leaves the frame.
  TRACK_TTL_SECONDS = "5.0"


[[vm]]
  # Dedicated CPU — on shared CPU the machine, not the code, caps the frame rate.
  size = "performance-8x"
  # 4 GB: torch + the Swin-T backbone does not fit in 2 GB when
  # DETECTION_ENGINE=grounding_dino.
  memory = "16384mb"
