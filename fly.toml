# fly.toml app configuration file generated for atlas-detector on 2026-09-04T20:43:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'atlas-detector'
primary_region = 'ams'

[build]

[env]
  DETECTION_CLASSES = 'person,car,truck,bus,motorcycle,boat'
  DETECTION_CONFIDENCE = '0.35'
  DETECTION_FPS = '5'
  TRACK_TTL_SECONDS = '3'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2048mb'
